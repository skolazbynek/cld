base_image = "claude-base:latest"
devcontainer_image = "claude-devcontainer:latest"
run_image = "claude-run:latest"

# SSL CA certificates: internal (Seznam) CAs are baked into the base image
# trust store and consumed via SSL_CERT_FILE / REQUESTS_CA_BUNDLE /
# NODE_EXTRA_CA_CERTS. Set ssl_certs_path only as an opt-in escape hatch to
# *replace* the baked bundle with a host-supplied dir or PEM file. There is
# no auto-detect / auto-mount anymore.
# ssl_certs_path = "/etc/ssl/certs"

# Agent-wait tunables (used by chain orchestrator)
agent_timeout = 1800   # seconds to wait for an agent before declaring timeout
poll_interval = 30     # seconds between docker-ps polls

# Chain orchestration tunables
# chain_max_parallel = 4    # max agents running in parallel in a chain
# chain_default_model = ""  # model override for chain agents; empty = use agent default

# Diagnostics
debug = false

# Logging
# log_level = "INFO"          # DEBUG / INFO / WARNING / ERROR
# log_color = "auto"          # auto / always / never

# RO $HOME paths staged into every container (relative to $HOME).
# Extend or narrow this list to match your actual tooling. Read from this file
# only (a repo's .cld/config.toml is ignored). A path must be relative, with no
# "..", no symlink in it and no overlap with a repo; others are skipped.
home_mounts_always = [
    ".claude.json",
    ".config/claude"
]

# Additional RO $HOME paths staged only for interactive devcontainer sessions.
# Remove entries for tools you don't use (e.g. drop nvim lines if you use vim/emacs).
home_mounts_devcontainer = [
    ".gitconfig",
    ".bashrc"
]

# Named repo registry for ticket containers (`cld start <ticket> <repo>...`).
# Names become the subdirectory names inside the ticket root, so kebab-case
# only (lowercase letters, digits, dashes). Manage with `cld repos add/rm`,
# or edit by hand. default_rev is the anchor offered at launch (empty =
# trunk()); bootstrap = true runs poetry install in the repo's pyproject_dir
# on first boot.
# [repos.my-api]
# path = "~/projects/my-api"
# default_rev = "trunk()"
# bootstrap = false

# SSH agent forwarding into devcontainer sessions.
# Omit this key to auto-detect from the host's $SSH_AUTH_SOCK.
# Set to "" to disable forwarding. Set to an explicit socket path to override.
# ssh_auth_sock = ""

# Inter-container agent messaging (mailboxes + the headless agent supervisor)
# mailbox_root = "~/.cld/mailboxes"  # host root for the mailbox tree
# agent_max_turns = 120              # per-message turn cap for the agent supervisor
#                                    # (an implementation task spends turns fast; 30 was
#                                    #  not enough for one to reach its first commit)
# agent_kickoff_persona = "agent"  # kickoff persona for the supervisor's non-task mode;
#                                  # vestigial -- the standing `cld agent` role that used
#                                  # it is gone, and a task-agent kicks off from its brief

# Task-scoped agents (see docs/design-task-agents.md)
# max_task_agents = 4       # max running task-agents per master
# peer_absolute_limit = 10  # hop budget for a peer edge whose --peer spec omits one
# root_ask_limit = 3        # asks allowed on a peer edge while one stays unanswered

# The cld broker. Set broker_key to enable the `cld broker <action>` wrapper
# inside a container, which runs the repo's tests on the host via the standalone
# `runtests` container, keeping secrets off the container. Requires host-side
# setup (see broker/README.md). Off until broker_key is set.
# broker_key = "~/.cld/broker/broker_key"
# broker_endpoint = "host.docker.internal:2222"   # [user@]host:port
# broker_known_hosts = "~/.cld/broker/known_hosts"

# Host-side OpenTelemetry collector (see otel/README.md). Set otel_endpoint to
# point agent/task-agent/ticket containers at it --
# Claude Code's own OTEL export is used as-is, tagged with the session name as
# a standard `service.name` resource attribute. The collector itself is a
# plain, cld-independent OTel Collector, not cld infrastructure. Off until set.
# otel_endpoint = "host.docker.internal:4318"
